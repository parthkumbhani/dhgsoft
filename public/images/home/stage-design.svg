<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A13"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>

  <!-- Blueprint Grid -->
  <g stroke="rgba(6, 182, 212, 0.05)" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="800"/><line x1="40" y1="0" x2="40" y2="800"/><line x1="80" y1="0" x2="80" y2="800"/><line x1="120" y1="0" x2="120" y2="800"/><line x1="160" y1="0" x2="160" y2="800"/><line x1="200" y1="0" x2="200" y2="800"/><line x1="240" y1="0" x2="240" y2="800"/><line x1="280" y1="0" x2="280" y2="800"/><line x1="320" y1="0" x2="320" y2="800"/><line x1="360" y1="0" x2="360" y2="800"/><line x1="400" y1="0" x2="400" y2="800"/><line x1="440" y1="0" x2="440" y2="800"/><line x1="480" y1="0" x2="480" y2="800"/><line x1="520" y1="0" x2="520" y2="800"/><line x1="560" y1="0" x2="560" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/><line x1="640" y1="0" x2="640" y2="800"/><line x1="680" y1="0" x2="680" y2="800"/><line x1="720" y1="0" x2="720" y2="800"/><line x1="760" y1="0" x2="760" y2="800"/><line x1="800" y1="0" x2="800" y2="800"/><line x1="840" y1="0" x2="840" y2="800"/><line x1="880" y1="0" x2="880" y2="800"/><line x1="920" y1="0" x2="920" y2="800"/><line x1="960" y1="0" x2="960" y2="800"/><line x1="1000" y1="0" x2="1000" y2="800"/><line x1="1040" y1="0" x2="1040" y2="800"/><line x1="1080" y1="0" x2="1080" y2="800"/><line x1="1120" y1="0" x2="1120" y2="800"/><line x1="1160" y1="0" x2="1160" y2="800"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="640" x2="1200" y2="640"/><line x1="0" y1="680" x2="1200" y2="680"/><line x1="0" y1="720" x2="1200" y2="720"/><line x1="0" y1="760" x2="1200" y2="760"/>
